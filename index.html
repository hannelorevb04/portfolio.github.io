    <title>Welkom - Hannelore Van Buynderen</title>
   <style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #102e4a;
        color: #fff;
        font-family: 'Montserrat', sans-serif;
        overflow: hidden;
    }

    h1 {
        width: 100%;
        margin: 0;
        padding: 0 1rem;
        box-sizing: border-box;
        text-align: center;
        font-size: clamp(2rem, 6vw, 4rem);
        font-weight: 800;
        animation: fadeIn 1.5s ease-in-out;
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(20px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
</style>

<body>
